name: Hourly IP Ping Check

on:
  schedule:
    - cron: '0 * * * *' # Esegue il controllo ogni ora (al minuto 0)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
          - name: Verifica Raggiungibilità IP
            run: |
              TARGET_IP="82.84.135.41"
              
              # Tentativo di connessione HTTP con timeout di 10 secondi
              # (Modifica in https://$TARGET_IP se il tuo servizio usa HTTPS)
              if curl -m 10 -s -o /dev/null -w "%{http_code}" http://$TARGET_IP | grep -E "200|301|302|401|403"; then
                echo "Servizio raggiungibile."
              else
                echo "ERRORE: Servizio non raggiungibile o offline!"
                exit 1
              fi
