name: Hourly IP Ping Check

on:
  schedule:
    - cron: '0 * * * *' # Esegue il controllo ogni ora (al minuto 0)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Esegui Ping dell'IP
        run: |
          TARGET_IP="82.84.135.41"
          
          # Esegue il ping (3 pacchetti) o verifica una porta specifica se l'ICMP è bloccato
          if ping -c 3 $TARGET_IP; then
            echo "IP raggiungibile."
          else
            echo "ERRORE: IP non raggiungibile!"
            exit 1 # Questo fa fallire il workflow e attiva la notifica email
          fi
